<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 860" width="1520" height="860" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/>
    </marker>
    <style>
      .h    { font-size:19px; font-weight:700; fill:#202124 }
      .sub  { font-size:12.5px; fill:#5f6368 }
      .zone { font-size:10.5px; fill:#80868b; font-weight:700; letter-spacing:.09em }
      .n    { font-size:13.5px; font-weight:600; fill:#202124 }
      .d    { font-size:11px; fill:#5f6368 }
      .nw   { font-size:13.5px; font-weight:600; fill:#fff }
      .dw   { font-size:11px; fill:#d2e3fc }
      .nb   { font-size:13.5px; font-weight:600; fill:#1a73e8 }
      .db   { font-size:11px; fill:#1967d2 }
      .e    { stroke:#5f6368; stroke-width:1.5; fill:none; marker-end:url(#a) }
      .eb   { stroke:#1a73e8; stroke-width:1.5; fill:none; marker-end:url(#ab) }
      .l    { font-size:10.5px; fill:#5f6368 }
      .lb   { font-size:10.5px; fill:#1a73e8 }
    </style>
  </defs>
  <rect width="1520" height="860" fill="#fff"/>

  <text x="44" y="42" class="h">VastuNest — architecture</text>
  <text x="44" y="64" class="sub">Gemini 3.5 Flash-Lite via the Google GenAI SDK. Track: Collaborative Partner.</text>

  <!-- clients -->
  <text x="44" y="112" class="zone">CLIENTS &amp; TRIGGERS</text>
  <rect x="44" y="126" width="190" height="58" rx="8" fill="#fff" stroke="#dadce0" stroke-width="1.5"/>
  <text x="62" y="150" class="n">Browser</text>
  <text x="62" y="169" class="d">buyer's session</text>

  <rect x="44" y="310" width="190" height="58" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="62" y="334" class="nb">Cloud Scheduler</text>
  <text x="62" y="353" class="db">cron 06:00 daily</text>

  <!-- frontend on cloud run -->
  <rect x="286" y="100" width="228" height="180" rx="10" fill="#f8f9fa" stroke="#dadce0" stroke-width="1.5"/>
  <text x="302" y="122" class="zone">CLOUD RUN</text>
  <rect x="302" y="136" width="196" height="70" rx="8" fill="#fff" stroke="#dadce0" stroke-width="1.5"/>
  <text x="318" y="160" class="n">Next.js UI</text>
  <text x="318" y="179" class="d">ranked list · inspector</text>
  <text x="318" y="195" class="d">feedback · tour picker</text>
  <text x="302" y="238" class="d">min-instances 0</text>
  <text x="302" y="256" class="d">max-instances 2</text>

  <path class="e" d="M234,155 L282,163"/>

  <!-- agent api -->
  <rect x="566" y="100" width="410" height="600" rx="10" fill="#f8f9fa" stroke="#dadce0" stroke-width="1.5"/>
  <text x="584" y="122" class="zone">CLOUD RUN — AGENT API (Express)</text>

  <rect x="584" y="138" width="374" height="52" rx="8" fill="#fff" stroke="#dadce0" stroke-width="1.5"/>
  <text x="600" y="161" class="n">server.ts</text>
  <text x="600" y="179" class="d">GET /api/scan (SSE) · POST /api/agent/run · /api/feedback · /api/tour/plan</text>

  <rect x="584" y="212" width="374" height="56" rx="8" fill="#fff" stroke="#dadce0" stroke-width="1.5"/>
  <text x="600" y="236" class="n">watchAgent</text>
  <text x="600" y="255" class="d">unattended cycle · reads new listings · decides whether to notify</text>

  <rect x="584" y="288" width="374" height="56" rx="8" fill="#fff" stroke="#dadce0" stroke-width="1.5"/>
  <text x="600" y="312" class="n">auditService</text>
  <text x="600" y="331" class="d">orchestration · perception cache lookup · concurrency pool</text>

  <rect x="584" y="364" width="374" height="56" rx="8" fill="#fff" stroke="#dadce0" stroke-width="1.5"/>
  <text x="600" y="388" class="n">geminiEvaluator</text>
  <text x="600" y="407" class="d">vision call · structured JSON · model fallback chain · timeouts</text>

  <rect x="584" y="440" width="374" height="56" rx="8" fill="#fff" stroke="#dadce0" stroke-width="1.5"/>
  <text x="600" y="464" class="n">scoringEngine</text>
  <text x="600" y="483" class="d">weighted dimensions · hard constraints · Vastu / Feng Shui tables</text>

  <rect x="584" y="516" width="374" height="56" rx="8" fill="#fff" stroke="#dadce0" stroke-width="1.5"/>
  <text x="600" y="540" class="n">feedbackInterpreter</text>
  <text x="600" y="559" class="d">free text → weight deltas</text>

  <rect x="584" y="592" width="374" height="56" rx="8" fill="#fff" stroke="#dadce0" stroke-width="1.5"/>
  <text x="600" y="616" class="n">tourPlanner</text>
  <text x="600" y="635" class="d">stop order · timings · Google Maps directions URL</text>

  <text x="584" y="678" class="d">memoryManager — Firestore client, local JSON fallback</text>

  <!-- internal flow -->
  <path class="e" d="M770,190 L770,208"/>
  <path class="e" d="M770,268 L770,284"/>
  <path class="e" d="M770,344 L770,360"/>
  <path class="e" d="M770,420 L770,436"/>

  <!-- client to api -->
  <path class="e" d="M498,171 C540,171 540,158 580,158"/>
  <text x="506" y="150" class="l">SSE</text>
  <path class="e" d="M234,339 C400,339 470,244 580,240"/>
  <text x="266" y="332" class="l">POST /api/agent/run · OIDC token</text>

  <!-- google ai -->
  <text x="1030" y="112" class="zone">GOOGLE AI</text>
  <rect x="1030" y="126" width="446" height="66" rx="8" fill="#1a73e8"/>
  <text x="1050" y="150" class="nw">Gemini 3.5 Flash-Lite</text>
  <text x="1050" y="169" class="dw">vision + structured output · floor plan and aerial images in</text>
  <text x="1050" y="185" class="dw">fallback: gemini-3.5-flash → gemini-3-flash-preview</text>

  <rect x="1030" y="204" width="446" height="48" rx="8" fill="#1a73e8" opacity=".75"/>
  <text x="1050" y="226" class="nw" font-size="12.5">Gemini 3.1 Flash Image</text>
  <text x="1050" y="243" class="dw">build-time only · generates the floor plan and aerial dataset</text>

  <path class="eb" d="M962,392 C1002,392 1002,176 1026,164"/>
  <text x="966" y="382" class="lb">images</text>
  <path class="eb" d="M962,548 C1010,548 1010,182 1026,172"/>
  <path class="eb" d="M962,624 C1018,624 1018,188 1026,180"/>

  <!-- state -->
  <text x="1030" y="300" class="zone">STATE</text>
  <rect x="1030" y="314" width="446" height="76" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="1050" y="338" class="nb">Firestore</text>
  <text x="1050" y="357" class="db">buyerProfiles — weights, hard constraints, learned notes</text>
  <text x="1050" y="374" class="db">agentBriefs, agentSeen — makes the cycle idempotent across restarts</text>

  <rect x="1030" y="402" width="446" height="60" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="1050" y="426" class="nb">Perception cache</text>
  <text x="1050" y="445" class="db">JSON, keyed by property, committed to the image and shipped</text>

  <path class="e" d="M1026,504 C994,504 990,180 966,168"/>
  <rect x="1030" y="474" width="446" height="60" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="1050" y="498" class="nb">Secret Manager</text>
  <text x="1050" y="517" class="db">GEMINI_API_KEY, mounted into the Cloud Run revision</text>

  <text x="1030" y="572" class="zone">TELEMETRY &amp; OUTPUT</text>
  <rect x="1030" y="586" width="446" height="60" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="1050" y="610" class="nb">Cloud Trace</text>
  <text x="1050" y="629" class="db">OpenTelemetry spans — audit.property, gemini.vision, agent.watchCycle</text>

  <rect x="1030" y="658" width="446" height="60" rx="8" fill="#fff" stroke="#dadce0" stroke-width="1.5"/>
  <text x="1050" y="682" class="n">Google Maps</text>
  <text x="1050" y="701" class="d">directions URL, each viewing a waypoint</text>

  <!-- state edges -->
  <path class="e" d="M962,232 C994,232 994,332 1026,340"/>
  <text x="966" y="224" class="l">writes</text>
  <path class="e" d="M962,470 C990,470 998,438 1026,430"/>
  
  <path class="e" d="M962,462 C986,462 986,360 1026,356"/>
  <path class="e" d="M962,164 C1022,164 1022,600 1026,612"/>
  <path class="e" d="M962,636 C994,636 1000,676 1026,684"/>

  <!-- footer: deployment facts, not claims -->
  <text x="44" y="760" class="zone">DEPLOYMENT</text>
  <text x="44" y="784" class="d">Two Cloud Run services in us-central1, both min-instances 0. Cloud Scheduler invokes the agent with an OIDC token from a dedicated service account.</text>
  <text x="44" y="804" class="d">Perception is cached per property, so a preference or tradition change re-scores from cache and makes no model call.</text>
  <text x="44" y="824" class="d">Firestore is the system of record; a local JSON store is used when credentials are absent.</text>
</svg>
