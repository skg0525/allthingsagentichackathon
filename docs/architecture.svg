<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e37400"/>
    </marker>
    <style>
      .t   { font-size:15px; fill:#202124; font-weight:600 }
      .s   { font-size:12.5px; fill:#5f6368 }
      .lbl { font-size:11.5px; fill:#5f6368 }
      .lblb{ font-size:11.5px; fill:#1a73e8; font-weight:600 }
      .zone{ font-size:12px; fill:#9aa0a6; font-weight:600; letter-spacing:.08em }
      .num { font-size:11px; fill:#e37400; font-weight:700; letter-spacing:.1em }
      .w   { fill:#fff; font-weight:600; font-size:15px }
      .ws  { fill:#d2e3fc; font-size:12.5px }
      .e   { stroke:#5f6368; stroke-width:1.6; fill:none; marker-end:url(#a) }
      .eb  { stroke:#1a73e8; stroke-width:1.8; fill:none; marker-end:url(#ab) }
      .eo  { stroke:#e37400; stroke-width:2.6; fill:none; marker-end:url(#ao) }
      .ed  { stroke:#9aa0a6; stroke-width:1.4; fill:none; stroke-dasharray:5 4; marker-end:url(#a) }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#fff"/>

  <!-- title -->
  <text x="60" y="58" font-size="26" font-weight="700" fill="#202124">VastuNest</text>
  <text x="196" y="58" font-size="16" fill="#5f6368">— an autonomous home-buying agent</text>
  <text x="240" y="121" font-size="13.5" fill="#5f6368">Gemini reads the drawings. Code decides what they mean to you.</text>

  <!-- ================= Cloud Run boundary ================= -->
  <rect x="48" y="148" width="1050" height="672" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="1.5"/>
  <text x="700" y="176" class="zone">GOOGLE CLOUD RUN · SCALES TO ZERO</text>

  <!--  two entry points  -->
  <rect x="80" y="182" width="230" height="76" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.5"/>
  <text x="100" y="212" class="t">Command center</text>
  <text x="100" y="234" class="s">Next.js · you ask</text>
  <text x="100" y="251" class="s">rank · inspect · teach · tour</text>

  <rect x="836" y="182" width="230" height="76" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.5"/>
  <text x="856" y="212" class="t">watchAgent</text>
  <text x="856" y="234" class="s">nobody asks · 06:00 daily</text>
  <text x="856" y="251" class="s">reads · decides · stays silent</text>

  <!-- external triggers -->
  <rect x="80" y="96" width="120" height="40" rx="20" fill="#fff" stroke="#dadce0" stroke-width="1.5"/>
  <text x="112" y="121" class="t" font-size="13.5">Buyer</text>
  <path class="e" d="M140,136 L140,182"/>

  <rect x="1140" y="182" width="200" height="60" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="1160" y="208" class="t" fill="#1a73e8" font-size="14">Cloud Scheduler</text>
  <text x="1160" y="228" class="s" fill="#1a73e8">06:00 daily · cron</text>
  <path class="eb" d="M1140,212 L1074,212"/>

  <!-- ================= the spine ================= -->
  <text x="72" y="330" class="num">THE SPLIT EVERYTHING RESTS ON</text>

  <!-- 1 perception -->
  <rect x="80" y="348" width="290" height="128" rx="12" fill="#fef7e0" stroke="#f9ab00" stroke-width="2.5"/>
  <text x="104" y="380" class="num">1 · PERCEPTION</text>
  <text x="104" y="406" class="t">The model answers</text>
  <text x="104" y="428" class="s">“what is physically in this drawing?”</text>
  <text x="104" y="449" class="s">entrance · kitchen · tub or no tub</text>
  <text x="104" y="466" class="s">yard grade · road adjacency</text>

  <!-- 2 judgement -->
  <rect x="440" y="348" width="290" height="128" rx="12" fill="#fef7e0" stroke="#f9ab00" stroke-width="2.5"/>
  <text x="464" y="380" class="num">2 · JUDGEMENT</text>
  <text x="464" y="406" class="t">Code answers</text>
  <text x="464" y="428" class="s">“how well does that fit <tspan font-style="italic">you</tspan>?”</text>
  <text x="464" y="449" class="s">weighted dimensions · hard limits</text>
  <text x="464" y="466" class="s">Vastu ⇄ Feng Shui rule tables</text>

  <!-- 3 acts -->
  <rect x="800" y="348" width="266" height="128" rx="12" fill="#fef7e0" stroke="#f9ab00" stroke-width="2.5"/>
  <text x="824" y="380" class="num">3 · IT ACTS</text>
  <text x="824" y="406" class="t">Tour planner</text>
  <text x="824" y="428" class="s">orders stops by geography</text>
  <text x="824" y="449" class="s">times them · says what to check</text>
  <text x="824" y="466" class="s">at each door</text>

  <!-- spine arrows -->
  <path class="eo" d="M370,412 L436,412"/>
  <path class="eo" d="M730,412 L796,412"/>
  <text x="386" y="386" class="lbl" font-size="11" font-weight="600" fill="#e37400">23ms</text>
  <text x="381" y="443" class="lbl" font-size="10.5">0 calls</text>

  <!-- entry points into the spine -->
  <path class="e" d="M195,258 L195,344"/>
  <text x="205" y="300" class="lbl">SSE stream</text>
  <path class="e" d="M951,258 L951,344"/>

  <!-- results back to the UI -->
  <path class="e" d="M585,348 C585,300 340,300 300,246" stroke-dasharray="0"/>
  <text x="392" y="292" class="lbl">ranked results</text>

  <!-- ================= right rail: Google services ================= -->
  <text x="1140" y="234" class="zone">GOOGLE AI</text>
  <rect x="1140" y="262" width="404" height="80" rx="10" fill="#1a73e8"/>
  <text x="1164" y="294" class="w">Gemini 3.5 Flash-Lite</text>
  <text x="1164" y="316" class="ws">vision · structured JSON output</text>
  <text x="1164" y="334" class="ws">fallback → 3.5-flash → 3-flash-preview</text>
  <path class="eb" d="M300,348 L300,318 L1120,318 L1136,302" stroke-dasharray="0"/>
  <text x="640" y="310" class="lblb">floor plan + aerial</text>

  <rect x="1140" y="358" width="404" height="52" rx="10" fill="#1a73e8" opacity=".82"/>
  <text x="1164" y="384" class="w" font-size="13.5">Gemini 3.1 Flash Image</text>
  <text x="1164" y="402" class="ws" font-size="11.5">build-time · generates the plan + aerial dataset</text>

  <!-- ================= state row ================= -->
  <text x="72" y="576" class="zone">STATE · PERSISTENCE · TELEMETRY</text>

  <rect x="80" y="596" width="290" height="88" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="104" y="626" class="t" fill="#1a73e8">Firestore</text>
  <text x="104" y="648" class="s" fill="#1a73e8">preference profile · learned weights</text>
  <text x="104" y="666" class="s" fill="#1a73e8">agent briefs · seen-list</text>
  <text x="104" y="678" class="lbl" fill="#1a73e8" font-size="10.5">idempotent — the cycle resumes after a restart</text>

  <rect x="440" y="596" width="290" height="88" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="464" y="626" class="t" fill="#1a73e8">Perception cache</text>
  <text x="464" y="648" class="s" fill="#1a73e8">keyed by property · shipped in the image</text>
  <text x="464" y="666" class="s" fill="#1a73e8">a fresh clone scans in 23ms</text>

  <rect x="800" y="596" width="266" height="88" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="824" y="626" class="t" fill="#1a73e8">Cloud Trace</text>
  <text x="824" y="648" class="s" fill="#1a73e8">OpenTelemetry spans</text>
  <text x="824" y="666" class="s" fill="#1a73e8">the reasoning chain, auditable</text>

  <!-- state edges -->
  <path class="ed" d="M585,476 L585,592"/>
  <text x="595" y="540" class="lbl">the weights you taught it</text>
  <path class="ed" d="M225,476 L225,592"/>
  <path class="ed" d="M300,476 C300,540 400,560 436,600"/>
  <path class="ed" d="M933,476 L933,592"/>

  <!-- maps output -->
  <rect x="1140" y="596" width="404" height="52" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.5"/>
  <text x="1164" y="622" class="t" font-size="14">Google Maps</text>
  <text x="1164" y="640" class="s">directions link · every stop a waypoint</text>
  <path class="e" d="M1066,440 C1110,440 1110,570 1136,614"/>

  <!-- ================= the one line ================= -->
  <rect x="48" y="742" width="1496" height="72" rx="12" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="76" y="776" font-size="15.5" font-weight="700" fill="#202124">The model never sees your weights, and never produces a score.</text>
  <text x="76" y="800" font-size="13.5" fill="#5f6368">That single separation is why perception caches, why a re-rank costs nothing, why swapping Vastu for Feng Shui re-ranks without touching Gemini — and why every claim can be checked against the drawing it came from.</text>

  <text x="48" y="866" font-size="12" fill="#9aa0a6">93% exact · 0% wrong across 42 fields of known ground truth  ·  npm run verify:seed</text>
</svg>
